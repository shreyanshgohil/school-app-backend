# Optional local MongoDB for development: docker compose up -d
# Port 27018 so it does not clash with a MongoDB already installed on 27017.
# Then set MONGODB_URI=mongodb://localhost:27018/shala_sangathi in .env
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - shala_mongodata:/data/db

volumes:
  shala_mongodata:
